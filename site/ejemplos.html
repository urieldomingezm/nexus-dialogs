<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ejemplos · nexus-dialogs</title>
    <meta name="description" content="Ejemplos en vivo de nexus-dialogs: diálogos, recetas, formularios, asistentes, importar y exportar, toasts y temas. Pulsa «Probar» y copia el código." />
  </head>
  <body>
    <a class="saltar" href="#galeria">Saltar al contenido</a>
    <!--@cabecera:ejemplos-->
    <main>
      <section class="hero chico">
        <h1>Ejemplos</h1>
        <p class="lema"><span id="total">…</span> ejemplos que se ejecutan de verdad con el código de esta versión (<strong>v<!--@version--></strong>). Pulsa <strong>Probar</strong>, mira el resultado y copia el código.</p>
      </section>
      <div class="filtros" role="search">
        <input id="buscar" type="search" placeholder="Buscar: formulario, RFC, toast, Excel…" aria-label="Buscar ejemplos" />
        <div id="chips" class="chips" role="group" aria-label="Filtrar por grupo"></div>
      </div>
      <div id="galeria"></div>
      <p id="vacio" class="vacio" hidden>Ningún ejemplo coincide. Prueba con otra palabra.</p>
    </main>
    <!--@pie-->
    <script type="module" src="./src/ejemplos.ts"></script>
  </body>
</html>

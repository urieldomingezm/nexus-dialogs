name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, unitarias, build y tamaño
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias + cobertura
        run: npm run test:coverage

      - name: Build (librería + tipos)
        run: npm run build

      - name: Sitio de documentación
        run: npm run build:site

      - name: El sitio construido incluye su código (buscador, demo, animaciones)
        run: node scripts/revisar-sitio.mjs

      - name: Tamaño (gzip)
        run: npm run size

      - name: La API pública coincide con api/nexus-dialogs.api.md
        run: npm run api:check

      - name: La matriz de compatibilidad coincide con package.json, el README y docs/soporte.md
        run: npm run compat:check

      - name: Auditoría de lo que se publica (sin dependencias vulnerables en producción)
        run: npm audit --omit=dev --audit-level=low

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          retention-days: 7

  tamano:
    name: Tamaño vs rama base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: .base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compilar la rama base
        working-directory: .base
        run: npm ci && npm run build
      - name: Compilar este PR
        run: npm ci && npm run build
      - name: Comparar (tabla en el resumen del job)
        run: node scripts/tamano.mjs --base .base

  paquete:
    name: Paquete publicado (tipos, Node, Vite, webpack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Are The Types Wrong + proyectos de prueba
        run: npm run check:paquete

  e2e:
    name: E2E (${{ matrix.navegador }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Instalar ${{ matrix.navegador }}
        run: npx playwright install --with-deps ${{ matrix.navegador }}

      - name: Build (el sitio de documentación mide los tamaños reales de dist/)
        run: npm run build

      - name: Pruebas de punta a punta
        run: npx playwright test --project=${{ matrix.navegador }}

      - name: Subir reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.navegador }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # La matriz de compatibilidad (compat/matriz.json) también decide qué se ejecuta aquí: cada versión de Vue, React y
  # Angular que figura en docs/soporte.md se instala de verdad y corre las pruebas de su envoltura.
  matriz:
    name: Matriz de compatibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frameworks: ${{ steps.m.outputs.frameworks }}
      node: ${{ steps.m.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          echo "frameworks=$(node scripts/compat.mjs --ci)" >> "$GITHUB_OUTPUT"
          echo "node=$(node scripts/compat.mjs --node)" >> "$GITHUB_OUTPUT"

  frameworks:
    name: ${{ matrix.nombre }}
    needs: matriz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matriz.outputs.frameworks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ${{ matrix.paquetes }}
        run: npm i --no-save --no-audit --no-fund ${{ matrix.paquetes }}
      - name: Pruebas de la envoltura
        run: npx vitest run ${{ matrix.pruebas }}

  node:
    name: Node ${{ matrix.node }}
    needs: matriz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.matriz.outputs.node) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # La librería se compila con Node 22; lo que se prueba es que su resultado funcione en cada Node soportado.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:node

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexus-dialogs · pruebas</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f9; color: #1c1d26 }
  h1 { margin: 0 0 4px } p { margin: 0 0 16px; color: #4b4d5c }
  section { margin: 0 0 18px } h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #5c5f70; margin: 0 0 8px }
  .fila { display: flex; flex-wrap: wrap; gap: 8px }
  button { height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid #c9ccd8; background: #fff; cursor: pointer; font: inherit }
  pre { background: #fff; border: 1px solid #e6e8ef; border-radius: 8px; padding: 10px; min-height: 40px; white-space: pre-wrap }
  .alto { height: 1200px }
</style>
</head>
<body>
<h1>nexus-dialogs</h1>
<p>Página de pruebas (la usan los tests E2E). Cada botón abre un diálogo; el resultado aparece abajo.</p>

<section><h2>Diálogos</h2><div class="fila">
  <button id="b-alert">Alerta con timer</button>
  <button id="b-confirm">Confirmar peligro</button>
  <button id="b-typed">Escribir para borrar</button>
  <button id="b-prompt">Prompt</button>
  <button id="b-drawer">Panel lateral</button>
  <button id="b-sheet">Hoja inferior</button>
  <button id="b-nested">Diálogo sobre diálogo</button>
</div></section>

<section><h2>Formularios</h2><div class="fila">
  <button id="b-form">Formulario</button>
  <button id="b-wizard">Asistente</button>
  <button id="b-gasto">Gasto (importe y RFC)</button>
</div></section>

<section><h2>Campos avanzados</h2><div class="fila">
  <button id="c-combo">Buscar y seleccionar</button>
  <button id="c-file">Subir archivos</button>
  <button id="c-range">Rango de fechas</button>
  <button id="c-otp">Código de verificación</button>
  <button id="c-items">Partidas con totales</button>
  <button id="c-contacto">Teléfono y dirección</button>
  <button id="c-cliente">Asistente con paso condicional</button>
  <button id="c-json">Formulario desde JSON</button>
</div></section>

<section><h2>RR. HH.</h2><div class="fila">
  <button id="h-vacaciones">Vacaciones (calendario)</button>
  <button id="h-firma">Firmar recibo</button>
  <button id="h-importar">Importar empleados</button>
  <button id="h-elegir">Elegir empleados</button>
  <button id="h-sepomex">Domicilio con SEPOMEX</button>
  <button id="h-fecha">Fecha con calendario</button>
  <button id="h-exportar">Exportar a Excel</button>
  <button id="h-alta">Plantilla: alta de empleado</button>
  <button id="h-permiso">Plantilla: permiso</button>
  <button id="h-baja">Plantilla: baja</button>
  <button id="h-gastos">Plantilla: gastos</button>
  <button id="h-incapacidad">Plantilla: incapacidad</button>
  <button id="th-en">Inglés</button>
  <button id="th-es">Español</button>
</div></section>

<section><h2>Recetas (nexus-dialogs/patterns)</h2><div class="fila">
  <button id="r-delete">Eliminar con nombre</button>
  <button id="r-unsaved">Cambios sin guardar</button>
  <button id="r-session">Sesión por expirar</button>
  <button id="r-approval">Aprobar vacaciones</button>
  <button id="r-bulk">Acción masiva</button>
  <button id="r-choose">Elegir una opción</button>
  <button id="r-loading">Pantalla de espera</button>
  <button id="r-mx">Datos de México</button>
</div></section>

<section><h2>Toasts</h2><div class="fila">
  <button id="t-ok">Éxito</button>
  <button id="t-undo">Con deshacer</button>
  <button id="t-err">Error</button>
  <button id="t-promise">Promesa</button>
  <button id="t-many">Cinco seguidos (cola)</button>
  <button id="t-in-dialog">Toast con diálogo abierto</button>
</div></section>

<section><h2>Temas</h2><div class="fila">
  <button id="th-dark">Oscuro</button>
  <button id="th-bootstrap">Bootstrap</button>
  <button id="th-light">Claro</button>
  <button id="th-en">English</button>
</div></section>

<pre id="out" aria-live="polite"></pre>
<div class="alto"></div>

<script type="module">
  import * as nd from 'nexus-dialogs'
  import { form, wizard, formFromJSON } from '../../src/forms.ts'
  import { toast } from '../../src/toast.ts'
  import { themes } from '../../src/themes.ts'
  import * as patterns from '../../src/patterns.ts'
  import { importData, exportData } from '../../src/import.ts'
  import { plantillas, sinResolvers } from '../../src/rrhh.ts'
  import { pickRows } from '../../src/table.ts'
  import { sepomexLookup } from '../../src/sepomex.ts'
  const { dialog, configure } = nd
  configure({ strictHtml: false }) // esta página de pruebas solo usa html propio
  window.nd = { ...nd, ...patterns, form, wizard, toast, themes }
  const { confirmDelete, unsavedChanges, sessionTimeout, approval, bulkAction, choose, loading } = patterns
  const out = document.getElementById('out')
  const show = (r) => (out.textContent = JSON.stringify(r, null, 1))
  window.ultimo = null
  const on = (id, fn) => document.getElementById(id).addEventListener('click', async () => { const r = await fn(); if (r) { window.ultimo = r; show(r) } })
  const espera = (ms) => new Promise((r) => setTimeout(r, ms))

  on('b-alert', () => dialog.success({ title: 'Empleado guardado', text: 'Laura ya aparece en la nómina de diciembre.', timer: 4000 }))
  on('b-confirm', () => dialog.confirm({ title: '¿Eliminar el registro?', text: 'Esta acción no se puede deshacer.', danger: true, confirmText: 'Sí, eliminar' }))
  on('b-typed', () => dialog.confirm({ title: '¿Eliminar el periodo de nómina?', text: 'Se borrarán 148 recibos y 12 incidencias. No se puede deshacer.', danger: true, requireText: 'Quincena 21', confirmText: 'Eliminar periodo' }))
  on('b-prompt', () => dialog.prompt({ title: 'Nueva área', label: 'Nombre del área', placeholder: 'Ej. Logística', confirmText: 'Crear área',
    validate: (v) => (v.length < 3 ? 'Escribe al menos 3 caracteres.' : null),
    preConfirm: async (v) => { await espera(500); if (v.toLowerCase() === 'almacén') throw new Error('Ya existe un área con ese nombre.'); return v } }))
  on('b-drawer', () => dialog.open({ title: 'Filtros', placement: 'right', html: '<p>Contenido del panel lateral.</p>', confirmText: 'Ver 128 resultados', cancelText: 'Limpiar' }))
  on('b-sheet', () => dialog.open({ title: 'Compartir reporte', placement: 'bottom', text: 'Elige cómo enviarlo.', confirmText: 'Enviar' }))
  on('b-nested', () => dialog.open({ title: 'Primer diálogo', text: 'Abre otro encima.', buttons: [
    { id: 'cancel', role: 'cancel', text: 'Cancelar' },
    { id: 'otro', text: 'Abrir otro', onClick: async () => { await dialog.alert('Segundo diálogo'); return false } },
  ] }))

  const areas = ['Almacén', 'Compras', 'Logística', 'Nómina']
  on('b-form', () => form({ title: 'Nuevo cliente', columns: 2, submitText: 'Crear cliente', fields: [
    { name: 'nombre', label: 'Nombre', required: true, span: 2, autocomplete: 'name' },
    { name: 'correo', label: 'Correo', type: 'email', required: true },
    { name: 'telefono', label: 'Teléfono', type: 'tel', help: '10 dígitos', pattern: '\\d{10}', patternMessage: 'Escribe 10 dígitos.' },
    { name: 'area', label: 'Área', type: 'select', options: areas, required: true },
    { name: 'tipo', label: 'Tipo', type: 'segmented', options: ['Persona', 'Empresa'], value: 'Persona' },
    { name: 'rfc', label: 'RFC', type: 'rfc', visible: (v) => v.tipo === 'Empresa', required: true },
    { name: 'factura', label: 'Requiere factura', type: 'switch', span: 2 },
  ], preConfirm: async (v) => { await espera(400); return v } }))

  on('b-wizard', () => wizard({ title: 'Alta de empleado', review: true, submitText: 'Dar de alta', steps: [
    { title: 'Datos personales', fields: [
      { name: 'nombre', label: 'Nombre completo', required: true },
      { name: 'curp', label: 'CURP', required: true, pattern: '[A-Z]{4}\\d{6}[HM][A-Z]{5}[A-Z\\d]\\d', patternMessage: 'La CURP debe tener 18 caracteres.' },
    ] },
    { title: 'Puesto', fields: [
      { name: 'area', label: 'Área', type: 'select', options: areas, required: true },
      { name: 'salario', label: 'Salario diario', type: 'money', required: true, min: 278.8 },
      { name: 'ingreso', label: 'Fecha de ingreso', type: 'date', required: true },
    ] },
    { title: 'Prestaciones', fields: [
      { name: 'vales', label: 'Vales de despensa', type: 'switch' },
      { name: 'seguro', label: 'Seguro de gastos médicos', type: 'radio', options: ['Básico', 'Amplio', 'Ninguno'], value: 'Básico' },
    ] },
  ] }))

  on('b-gasto', () => form({ title: 'Nuevo gasto', submitText: 'Enviar a aprobación', fields: [
    { name: 'rfc', label: 'RFC del proveedor', type: 'rfc', required: true },
    { name: 'importe', label: 'Importe', type: 'money', required: true, min: 1 },
    { name: 'concepto', label: 'Concepto', type: 'textarea', maxLength: 200 },
  ] }))

  on('r-delete', () => confirmDelete({ what: 'el periodo de nómina', name: 'Quincena 21', requireName: true,
    consequences: ['148 recibos calculados', '12 incidencias capturadas', 'El borrador de dispersión bancaria'] }).then((ok) => ({ ok })))
  on('r-unsaved', () => unsavedChanges({ changes: [
    { label: 'Puesto', from: 'Analista de nómina', to: 'Coordinadora de nómina' },
    { label: 'Salario diario', from: '$ 980.00', to: '$ 1,150.00' },
  ], onSave: () => espera(300) }).then((decision) => ({ decision })))
  on('r-session', () => sessionTimeout({ seconds: 90, text: 'Lo que llevas ya se guardó como borrador.' }).then((decision) => ({ decision })))
  on('r-approval', () => approval({
    title: 'Vacaciones de Diego Ramírez', subtitle: 'Solicitud SOL-2026-0412 · hace 2 h',
    details: [{ label: 'Fechas', value: '16 – 20 dic' }, { label: 'Días hábiles', value: '5' }, { label: 'Saldo después', value: '7 de 12' }],
    warning: '2 personas de Almacén ya tienen vacaciones esos días.',
    reasons: ['Cubre otro turno', 'Cierre de inventario', 'Sin saldo'], allowRequestInfo: true,
  }))
  const empleados = ['Ana Torres', 'Luis Herrera', 'Marta Gil', 'Óscar Núñez', 'Pedro Salas', 'Rosa Vega', 'Iván Cruz'].map((n, i) => ({ n, area: i === 3 ? 'Logística' : 'Almacén' }))
  on('r-bulk', () => bulkAction({ title: 'Cambiar de área a 7 empleados', items: empleados, label: (e) => e.n,
    describe: (e) => `${e.area} → Logística`, skip: (e) => e.area === 'Logística' && 'ya está en Logística',
    confirmText: (n) => `Mover ${n} empleados`,
    run: async (e) => { await espera(150); if (e.n === 'Pedro Salas') throw new Error('tiene una baja vigente') } })
    .then((r) => ({ confirmed: r.confirmed, done: r.done.length, failed: r.failed.map((x) => x.error), skipped: r.skipped.length })))
  on('r-choose', () => choose({ title: 'Exportar nómina', text: '¿En qué formato?', options: [
    { value: 'xlsx', label: 'Excel (.xlsx)', description: 'Para revisar y filtrar' },
    { value: 'csv', label: 'CSV', description: 'Para importar en otro sistema' },
    { value: 'pdf', label: 'PDF', description: 'Recibos listos para imprimir', disabled: true },
  ] }).then((value) => ({ value })))
  on('r-loading', () => loading('Timbrando 148 recibos…', () => espera(1200).then(() => 148)).then((n) => ({ n })))
  on('r-mx', () => form({ title: 'Datos fiscales y de nómina', columns: 2, submitText: 'Guardar', fields: [
    { name: 'rfc', label: 'RFC', type: 'rfc', required: true },
    { name: 'curp', label: 'CURP', type: 'curp', required: true },
    { name: 'nss', label: 'NSS', type: 'nss', required: true },
    { name: 'cp', label: 'Código postal', type: 'postal', required: true },
    { name: 'clabe', label: 'CLABE', type: 'clabe', required: true, span: 2 },
  ] }))

  const personas = [
    { value: 'ana', label: 'Ana Torres', description: 'Almacén · Supervisora', group: 'Almacén' },
    { value: 'luis', label: 'Luis Herrera', description: 'Almacén · Montacargas', group: 'Almacén' },
    { value: 'marta', label: 'Marta Gil', description: 'Nómina · Analista', group: 'Nómina' },
    { value: 'oscar', label: 'Óscar Núñez', description: 'Nómina · Coordinador', group: 'Nómina' },
    { value: 'rosa', label: 'Rosa Vega', description: 'Compras · Jefa', group: 'Compras', disabled: true },
  ]
  on('c-combo', () => form({ title: 'Asignar responsables', submitText: 'Asignar', fields: [
    { name: 'cliente', label: 'Cliente', type: 'combobox', required: true, placeholder: 'Escribe para buscar', creatable: true,
      search: async (q) => { await espera(200); return ['Abarrotes Lupita', 'Aceros del Norte', 'Agrícola San Juan', 'Bodegas Ramírez'].filter((x) => x.toLowerCase().includes(q.toLowerCase())) } },
    { name: 'equipo', label: 'Equipo', type: 'combobox', multiple: true, avatars: true, maxItems: 3, options: personas, value: ['ana'], required: true },
  ] }))
  on('c-file', () => form({ title: 'Documentos del empleado', submitText: 'Guardar', fields: [
    { name: 'ine', label: 'INE (frente y vuelta)', type: 'file', accept: '.pdf,image/*', maxSize: 5 * 1024 * 1024, required: true, multiple: true, maxFiles: 2,
      upload: (file, progreso) => new Promise((ok, mal) => { let p = 0; const t = setInterval(() => { p += 25; progreso(p); if (p >= 100) { clearInterval(t); file.name.includes('error') ? mal(new Error('el servidor rechazó el archivo')) : ok('id-' + file.name) } }, 120) }) },
    { name: 'cfdi', label: 'Factura (XML)', type: 'file', accept: '.xml', help: 'El XML del CFDI, no el PDF.' },
  ] }))
  on('c-range', () => form({ title: 'Reporte de incidencias', submitText: 'Generar', fields: [
    { name: 'periodo', label: 'Periodo', type: 'daterange', required: true, maxDays: 62 },
  ] }))
  on('c-otp', () => form({ title: 'Confirma que eres tú', text: 'Escribe el código de 6 dígitos que enviamos a an•••@empresa.mx.', submitText: 'Verificar', size: 'sm', fields: [
    { name: 'codigo', label: 'Código de verificación', type: 'otp', required: true, validate: (v) => (v === '123456' ? null : 'El código no coincide.') },
  ] }))
  on('h-vacaciones', () => form({ title: 'Solicitar vacaciones', submitText: 'Enviar solicitud', fields: [
    { name: 'dias', label: 'Fechas', type: 'daterange', calendar: true, businessDays: true, holidays: ['2026-12-24', '2026-12-31'], required: true, maxDays: 12, presets: false, help: 'Máximo 12 días hábiles. Los festivos de ley y los de la empresa no cuentan.' },
    { name: 'nota', label: 'Comentario', type: 'textarea' },
  ] }))
  on('h-firma', () => form({ title: 'Recibo de nómina · Quincena 21', text: 'Al firmar aceptas haber recibido $ 8,450.00 MXN.', submitText: 'Firmar recibo', fields: [
    { name: 'firma', label: 'Tu firma', type: 'signature', required: true },
  ] }))
  on('h-importar', () => importData({ title: 'Importar empleados', columns: [
    { name: 'numero', label: 'Número de empleado', required: true, unique: true, aliases: ['num', 'no'] },
    { name: 'nombre', label: 'Nombre completo', required: true, aliases: ['empleado'] },
    { name: 'rfc', label: 'RFC', type: 'rfc', unique: true },
    { name: 'ingreso', label: 'Fecha de ingreso', type: 'date' },
    { name: 'salario', label: 'Salario diario', type: 'number' },
  ], onImport: () => new Promise((r) => setTimeout(r, 300)) }))
  const AREAS = ['Almacén', 'Nómina', 'Ventas', 'Sistemas', 'Producción']
  const NOMBRES = ['Ana Torres', 'Luis Herrera', 'Marta Gil', 'Óscar Núñez', 'Sofía Ruiz', 'Jorge Peña', 'Elena Ríos', 'Raúl Vega']
  const EMPLEADOS = Array.from({ length: 480 }, (_, i) => ({ id: String(1001 + i), nombre: `${NOMBRES[i % 8]} ${i + 1}`, area: AREAS[i % 5], salario: 300 + (i % 9) * 55 }))
  const COLS = [
      { key: 'id', label: 'Núm.' },
      { key: 'nombre', label: 'Nombre' },
      { key: 'area', label: 'Área' },
      { key: 'salario', label: 'Salario diario', type: 'number' },
  ]
  on('h-fecha', () => form({ title: 'Cambio de puesto', columns: 2, fields: [
    { name: 'puesto', label: 'Nuevo puesto', required: true, span: 2 },
    { name: 'desde', label: 'A partir del', type: 'date', calendar: true, required: true, min: '2026-01-01' },
    { name: 'nacimiento', label: 'Fecha de nacimiento', type: 'date', calendar: true },
  ] }))
  on('h-exportar', () => pickRows({ title: 'Reporte de empleados', rows: EMPLEADOS, min: 0, confirmText: 'Cerrar',
    columns: COLS, onExport: (rows, format) => exportData(rows, { columns: COLS, format, filename: 'empleados', sheet: 'Empleados' }) }))
  on('h-alta', () => formFromJSON(plantillas.altaEmpleado, { resolvers: { rfcLibre: () => null, curpLibre: () => null, buscarCP } }))
  on('h-permiso', () => formFromJSON(plantillas.permiso))
  on('h-baja', () => formFromJSON(plantillas.baja))
  on('h-gastos', () => formFromJSON(plantillas.gastos))
  on('h-incapacidad', () => formFromJSON(plantillas.incapacidad))
  on('th-en', () => { configure({ lang: 'en' }); toast.configure?.({ lang: 'en' }) })
  on('th-es', () => { configure({ lang: 'es' }); toast.configure?.({ lang: 'es' }) })
  on('h-elegir', () => pickRows({ title: 'Agregar participantes al curso', rows: EMPLEADOS, max: 30, isDisabled: (e) => e.id === '1003',
    onExport: (rows, format) => exportData(rows, { columns: COLS, format, filename: 'participantes' }),
    columns: [
      { key: 'id', label: 'Núm.' },
      { key: 'nombre', label: 'Nombre' },
      { key: 'area', label: 'Área' },
      { key: 'salario', label: 'Salario diario', align: 'right', format: (v) => '$ ' + v.toFixed(2) },
    ] }))
  on('h-sepomex', () => form({ title: 'Domicilio', fields: [
    { name: 'dom', label: 'Domicilio', type: 'address', required: true, lookupPostalCode: sepomexLookup({ baseUrl: './cp/' }), help: 'Catálogo de prueba: 64000, 01000 o 44100' },
  ] }))
  // Catálogo de prueba (en una app real: tu API o SEPOMEX).
  const CPS = {
    '64000': { state: 'Nuevo León', municipality: 'Monterrey', neighborhoods: ['Centro', 'Obispado', 'María Luisa'] },
    '01000': { state: 'Ciudad de México', municipality: 'Álvaro Obregón', neighborhoods: ['San Ángel'] },
  }
  const buscarCP = (cp) => new Promise((r) => setTimeout(() => r(CPS[cp] ?? null), 150))
  on('c-contacto', () => form({ title: 'Datos de contacto', submitText: 'Guardar', draftKey: 'demo-contacto', fields: [
    { name: 'telefono', label: 'Teléfono', type: 'phone', required: true, help: 'Prueba 8112345678' },
    { name: 'direccion', label: 'Domicilio', type: 'address', required: true, lookupPostalCode: buscarCP, help: 'Prueba 64000 o 01000' },
  ] }))
  on('c-cliente', () => wizard({ title: 'Nuevo cliente', review: true, submitText: 'Crear cliente', draftKey: 'demo-cliente', steps: [
    { title: 'Tipo', fields: [{ name: 'tipo', label: 'Tipo de cliente', type: 'segmented', options: [{ value: 'persona', label: 'Persona' }, { value: 'empresa', label: 'Empresa' }], value: 'persona' }] },
    { title: 'Empresa', when: { field: 'tipo', equals: 'empresa' }, fields: [
      { name: 'razon', label: 'Razón social', required: true },
      { name: 'rfc', label: 'RFC', type: 'rfc', required: true },
    ] },
    { title: 'Contacto', fields: [
      { name: 'nombre', label: 'Nombre del contacto', required: true },
      { name: 'telefono', label: 'Teléfono', type: 'phone' },
    ] },
  ] }))
  const ESQUEMA = {
    title: 'Solicitud de permiso',
    submitText: 'Enviar solicitud',
    columns: 2,
    fields: [
      { name: 'motivo', label: 'Motivo', type: 'select', required: true, options: ['Personal', 'Médico', 'Otro'] },
      { name: 'goce', label: 'Con goce de sueldo', type: 'switch' },
      { name: 'otro', label: '¿Cuál?', required: true, span: 2, visibleIf: { field: 'motivo', equals: 'Otro' } },
      { name: 'fechas', label: 'Fechas', type: 'daterange', required: true, span: 2, maxDays: 15 },
      { name: 'comentario', label: 'Comentario para tu jefe', type: 'textarea', span: 2, validate: 'sinGroserias' },
    ],
  }
  on('c-json', () => formFromJSON(ESQUEMA, { resolvers: { sinGroserias: (v) => (/tonto/i.test(v ?? '') ? 'Cuida el tono.' : null) } }))
  const pesos = (n) => '$ ' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  on('c-items', () => form({ title: 'Nuevo gasto por comprobar', size: 'xl', submitText: 'Enviar a aprobación', fields: [
    { name: 'rfc', label: 'RFC del proveedor', type: 'rfc', required: true },
    { name: 'partidas', label: 'Partidas', type: 'items', required: true, addText: 'Agregar partida', maxRows: 10,
      fields: [
        { name: 'concepto', label: 'Concepto', required: true },
        { name: 'cantidad', label: 'Cantidad', type: 'number', required: true, min: 1, value: 1 },
        { name: 'precio', label: 'Precio unitario', type: 'money', required: true },
        { name: 'iva', label: 'IVA', type: 'select', options: [{ value: '0.16', label: '16 %' }, { value: '0', label: '0 %' }], value: '0.16' },
      ],
      totals: (filas) => {
        const sub = filas.reduce((s, r) => s + (r.cantidad || 0) * (r.precio || 0), 0)
        const iva = filas.reduce((s, r) => s + (r.cantidad || 0) * (r.precio || 0) * Number(r.iva || 0), 0)
        return [{ label: 'Subtotal', value: pesos(sub) }, { label: 'IVA', value: pesos(iva) }, { label: 'Total', value: pesos(sub + iva) }]
      } },
  ] }))

  on('t-ok', () => void toast.success('Empleado guardado'))
  on('t-undo', () => void toast('Se archivaron 3 recibos', { action: { label: 'Deshacer', onClick: () => toast.info('Recuperados') } }))
  on('t-err', () => void toast.error('No se pudo timbrar el recibo', { title: 'Error del SAT' }))
  on('t-promise', () => void toast.promise(espera(1200).then(() => 148), { loading: 'Calculando nómina…', success: (n) => `${n} recibos listos`, error: 'Falló' }))
  on('t-many', () => { for (let i = 1; i <= 5; i++) toast(`Aviso ${i}`) })
  on('t-in-dialog', async () => { setTimeout(() => toast.success('Guardado mientras el diálogo sigue abierto'), 300); return dialog.alert('Un diálogo abierto') })

  on('th-dark', () => { configure({ scheme: 'dark' }); toast.configure({ scheme: 'dark' }) })
  on('th-bootstrap', () => { configure({ scheme: 'light', theme: themes.bootstrap }) })
  on('th-light', () => { configure({ scheme: 'light', theme: Object.fromEntries(Object.keys(themes.bootstrap).map((k) => [k, ''])) }); toast.configure({ scheme: 'light' }) })
  on('th-en', () => configure({ lang: 'en' }))
</script>
</body>
</html>
